<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/main/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<link rel="icon" href="/main/img/favicon.ico" type="image/x-icon">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<title>Chill Time</title>
<style>
/* Фиксированный header не занимает место в потоке, поэтому резервируем его высоту. */
body {
    margin: 0;
    padding: 90px 0 60px;
}

/* Дополнительные стили для анимации смены текста */
.marquee-container {
position: relative;
height: 30px;
overflow: hidden;
}

.marquee-text {
position: absolute;
width: 100%;
text-align: center;
font-size: 20px;
color: white;
text-transform: uppercase;
transition: opacity 0.5s ease, transform 0.5s ease;
text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.7);
opacity: 0;
animation: textFade 24s infinite;
}

.marquee-text:nth-child(1) { animation-delay: 0s; }
.marquee-text:nth-child(2) { animation-delay: 4s; }
.marquee-text:nth-child(3) { animation-delay: 8s; }
.marquee-text:nth-child(4) { animation-delay: 12s; }
.marquee-text:nth-child(5) { animation-delay: 16s; }
.marquee-text:nth-child(6) { animation-delay: 20s; }

@keyframes textFade {
0% { opacity: 0; transform: translateY(20px); }
10% { opacity: 1; transform: translateY(0); }
20% { opacity: 1; transform: translateY(0); }
30% { opacity: 0; transform: translateY(-20px); }
100% { opacity: 0; transform: translateY(-20px); }
}

/* ===== NEW: Tabs & Features ===== */
.chill-tabs {
    display: flex;
    position: fixed;
    top: 88px;
    left: 20px;
    z-index: 1001;
    flex-direction: column;
    gap: 8px;
    width: 132px;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.chill-tab {
    width: 100%;
    padding: 10px 8px;
    border: 1px solid rgba(255,0,0,0.3);
    background: rgba(0,0,0,0.4);
    color: #ccc;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    text-align: center;
}
.chill-tab:hover { color: #fff; border-color: rgba(255,0,0,0.6); }
.chill-tab.active {
    background: linear-gradient(135deg, rgba(255,0,0,0.6), rgba(200,0,50,0.6));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 0 15px rgba(255,0,0,0.3);
}

/* В шапке остаётся только бегущая строка; разделы вынесены в боковое меню. */
header {
    height: 60px;
    min-height: 60px;
    box-sizing: border-box;
    padding: 15px 0;
}

.chill-section {
    display: none;
    max-width: 420px;
    margin: 0 auto 20px;
    padding: 0 16px;
    animation: chillFade 0.4s ease;
}
.chill-section.active { display: block; }
@keyframes chillFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Погода находится внутри вкладки, а не позиционируется поверх всей страницы. */
#weather {
    position: static;
    width: auto;
    transform: none;
    z-index: auto;
}

.chill-card {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,0,0,0.2);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(10px);
}

/* Pomodoro */
.pomo-ring-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 20px;
}
.pomo-ring-wrap svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
}
.pomo-ring-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 8; }
.pomo-ring-fill { fill: none; stroke: url(#pomoGrad); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 503; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
.pomo-time {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.4rem; font-weight: 800;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,0,0,0.5);
}
.pomo-label { text-align: center; color: #aaa; font-size: 0.85rem; margin-bottom: 16px; }
.pomo-label span { color: #ff4444; font-weight: 700; }
.pomo-btns { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
.pomo-btn {
    padding: 10px 24px; border: none; border-radius: 8px;
    font-size: 0.85rem; font-weight: 700; cursor: pointer;
    transition: all 0.3s; font-family: inherit;
}
.pomo-btn.start {
    background: linear-gradient(135deg, #ff4444, #cc0033);
    color: #fff;
    box-shadow: 0 0 15px rgba(255,0,0,0.3);
}
.pomo-btn.start:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(255,0,0,0.5); }
.pomo-btn.reset {
    background: rgba(255,255,255,0.08);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.15);
}
.pomo-btn.reset:hover { background: rgba(255,255,255,0.15); color: #fff; }
.pomo-modes { display: flex; gap: 8px; justify-content: center; }
.pomo-mode {
    padding: 6px 14px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05); color: #888;
    border-radius: 8px; font-size: 0.75rem; cursor: pointer;
    transition: all 0.3s; font-family: inherit;
}
.pomo-mode.active {
    background: linear-gradient(135deg, rgba(255,0,0,0.5), rgba(200,0,50,0.5));
    color: #fff; border-color: transparent;
}

/* Game 2048 */
.g2048-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.g2048-title { font-size: 1.3rem; font-weight: 800; color: #ff4444; text-shadow: 0 0 10px rgba(255,0,0,0.4); }
.g2048-score-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 14px; text-align: center; }
.g2048-score-label { font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.g2048-score { font-size: 1.1rem; font-weight: 800; color: #fff; }
.g2048-board {
    background: rgba(20,20,30,0.8);
    border-radius: 10px; padding: 8px;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 6px; aspect-ratio: 1; max-width: 320px; margin: 0 auto 14px;
    touch-action: none; user-select: none; position: relative;
    cursor: grab;
}
.g2048-board:active { cursor: grabbing; }
.g2048-cell {
    background: rgba(255,255,255,0.03); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.2rem; color: #fff;
    transition: all 0.15s ease;
}
.g2048-cell[data-v="2"] { background: rgba(255,68,68,0.2); color: #ff6b6b; }
.g2048-cell[data-v="4"] { background: rgba(255,68,68,0.3); color: #ff8888; }
.g2048-cell[data-v="8"] { background: rgba(255,165,0,0.3); color: #ffa500; }
.g2048-cell[data-v="16"] { background: rgba(255,165,0,0.4); color: #ffcc00; }
.g2048-cell[data-v="32"] { background: rgba(255,0,100,0.4); color: #ff4499; }
.g2048-cell[data-v="64"] { background: rgba(255,0,100,0.5); color: #ff66aa; }
.g2048-cell[data-v="128"] { background: rgba(150,80,255,0.4); color: #b388ff; font-size: 1rem; }
.g2048-cell[data-v="256"] { background: rgba(150,80,255,0.5); color: #d0b0ff; font-size: 1rem; }
.g2048-cell[data-v="512"] { background: rgba(150,80,255,0.6); color: #e8d0ff; font-size: 1rem; }
.g2048-cell[data-v="1024"] { background: linear-gradient(135deg, rgba(255,68,68,0.5), rgba(150,80,255,0.5)); color: #fff; font-size: 0.8rem; }
.g2048-cell[data-v="2048"] { background: linear-gradient(135deg, #ff4444, #ff8800); color: #fff; font-size: 0.8rem; box-shadow: 0 0 20px rgba(255,68,68,0.5); }
.g2048-over {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: none;
    flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; z-index: 10;
}
.g2048-over.show { display: flex; }
.g2048-over-text { font-size: 1.2rem; font-weight: 800; color: #ff4444; margin-bottom: 12px; text-align: center; padding: 0 10px; }
.g2048-over-btn {
    padding: 10px 24px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #ff4444, #cc0033);
    color: #fff; font-weight: 700; cursor: pointer; font-family: inherit;
}
.g2048-dpad {
    display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
    gap: 4px; justify-content: center; margin: 0 auto;
}
.g2048-dpad-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #fff; font-size: 1.3rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.g2048-dpad-btn:active { background: #ff4444; transform: scale(0.95); }
.g2048-dpad-btn:nth-child(2) { grid-column: 2; }
.g2048-dpad-btn:nth-child(3) { grid-column: 1; grid-row: 2; }
.g2048-dpad-btn:nth-child(4) { grid-column: 2; grid-row: 2; background: linear-gradient(135deg, #ff4444, #cc0033); font-size: 0.65rem; font-weight: 700; }
.g2048-dpad-btn:nth-child(5) { grid-column: 3; grid-row: 2; }
.g2048-dpad-btn:nth-child(6) { grid-column: 2; grid-row: 3; }
.g2048-hint { text-align: center; font-size: 0.7rem; color: #666; margin-top: 10px; }

@media (max-width: 400px) {
    .pomo-time { font-size: 2rem; }
    .g2048-cell { font-size: 1rem; }
    .g2048-cell[data-v="128"], .g2048-cell[data-v="256"], .g2048-cell[data-v="512"] { font-size: 0.85rem; }
    .g2048-cell[data-v="1024"], .g2048-cell[data-v="2048"] { font-size: 0.7rem; }
}

/* На узких экранах боковое меню стало бы тесным для игрового поля. */
@media (max-width: 700px) {
    body { padding: 142px 0 24px; }
    .chill-tabs {
        top: 78px;
        left: 50%;
        transform: translateX(-50%);
        flex-direction: row;
        width: min(400px, calc(100% - 32px));
    }
    .chill-tab { flex: 1; }

    /* На телефоне контент должен идти друг за другом, а не пересекаться с часами. */
    #id_clock {
        position: static;
        transform: none;
        margin: 0 auto 18px;
        text-align: center;
        font-size: clamp(32px, 10vw, 42px);
    }
    .chill-section {
        width: min(100%, 420px);
        box-sizing: border-box;
        margin: 0 auto 20px;
        padding: 0 12px;
    }
    .chill-card { padding: 16px; }
    #weather { box-sizing: border-box; padding: 0 4px !important; }
    .g2048-board { width: min(320px, 100%); }

    /* Дополнительные фиксированные элементы не закрывают открытую вкладку. */
    body.chill-tab-open #id_clock,
    body.chill-tab-open #music-player,
    body.chill-tab-open .falling-gifs-button { display: none; }

    .falling-gifs-button {
        top: auto;
        right: 10px;
        bottom: 140px;
    }
    .footer {
        position: static;
        box-sizing: border-box;
        margin-top: 24px;
    }
    #language-selector {
        top: 4px !important;
        right: 4px !important;
        gap: 2px !important;
    }
    #language-selector button { font-size: 18px !important; }
    .marquee-text { font-size: 16px; }
}
</style>

<body>
<div id="bg-loader" aria-hidden="true"></div>
<header>
<div class="marquee-container">
<div class="marquee-text">NEVER GIVE UP!</div>
<div class="marquee-text">ぜったいあきらめないで!</div>
<div class="marquee-text">НИКОГДА НЕ СДАВАЙСЯ!</div>
</div>
<nav class="chill-tabs" aria-label="Разделы сайта">
    <button class="chill-tab" data-tab="pomo">⏱️ Помодоро</button>

<div id="id_clock"></div>

<!-- Pomodoro Section -->

    <div class="chill-card">
        <svg width="0" height="0"><defs><linearGradient id="pomoGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ff4444"/><stop offset="100%" style="stop-color:#cc0033"/></linearGradient></defs></svg>
        <div class="pomo-ring-wrap">
            <svg viewBox="0 0 180 180"><circle class="pomo-ring-bg" cx="90" cy="90" r="80"/><circle class="pomo-ring-fill" cx="90" cy="90" r="80" id="pomoRing"/></svg>

<!-- 2048 Section -->
<div class="chill-section" id="g2048">
    <div class="chill-card" style="position:relative;">
        <div class="g2048-header">
            <div class="g2048-title">2048</div>
            <div class="g2048-score-box">
                <div class="g2048-score-label">Счёт</div>
                <div class="g2048-score" id="g2048Score">0</div>
            </div>
        </div>
        <div class="g2048-board" id="g2048Board">
            <div class="g2048-over" id="g2048Over">
                <div class="g2048-over-text" id="g2048OverText">Игра окончена!</div>
                <button class="g2048-over-btn" onclick="init2048()">Новая игра</button>
            </div>
        </div>
        <div class="pomo-btns" style="margin-bottom:14px;">
            <button class="pomo-btn start" onclick="init2048()">🔄 Новая игра</button>
        </div>
        <div class="g2048-dpad">
            <div></div>
            <button class="g2048-dpad-btn" onclick="move2048('up')">↑</button>

            <button class="g2048-dpad-btn" onclick="init2048()">NEW</button>
            <button class="g2048-dpad-btn" onclick="move2048('right')">→</button>

<!-- Weather Section -->

        <p>Загрузка погоды...</p>

<!-- ===== NEW: Inline scripts for Pomodoro & 2048 ===== -->
<script>
// --- TABS ---
function openChillTab(tab) {
    const section = document.getElementById(tab.dataset.tab);
    if (!section) return;

        document.querySelectorAll('.chill-tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.chill-section').forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        section.classList.add('active');
        document.body.classList.add('chill-tab-open');
}

document.querySelectorAll('.chill-tab').forEach(tab => {
    tab.addEventListener('click', () => openChillTab(tab));
});

// --- POMODORO ---
let pT = 25*60, pTotal = 25*60, pRun = false, pInt = null, pMode = 'work';
const pTimeEl = document.getElementById('pomoTime');
const pRing = document.getElementById('pomoRing');
const pStart = document.getElementById('pomoStart');
const pLabel = document.getElementById('pomoLabel');
const CIRC = 2 * Math.PI * 80;

function fmt(s){ const m=Math.floor(s/60).toString().padStart(2,'0'), sec=(s%60).toString().padStart(2,'0'); return m+':'+sec; }
function updPomo(){ pTimeEl.textContent = fmt(pT); pRing.style.strokeDashoffset = CIRC * (1 - pT/pTotal); }

pStart.addEventListener('click', () => {
    if(pRun){ clearInterval(pInt); pRun=false; pStart.textContent='Старт'; pStart.classList.add('start'); }
    else {
        pRun=true; pStart.textContent='Пауза';
        pInt = setInterval(() => {
            if(pT>0){ pT--; updPomo(); }
            else { clearInterval(pInt); pRun=false; pStart.textContent='Старт';
                if('Notification' in window && Notification.permission==='granted'){
                    new Notification('Chill Time', {body: pMode==='work'?'Время отдохнуть!':'Время работать!'});
                }
            }
        }, 1000);
    }
});
document.getElementById('pomoReset').addEventListener('click', () => { clearInterval(pInt); pRun=false; pStart.textContent='Старт'; pT=pTotal; updPomo(); });
document.querySelectorAll('.pomo-mode').forEach(b => {
    b.addEventListener('click', () => {
        document.querySelectorAll('.pomo-mode').forEach(x=>x.classList.remove('active')); b.classList.add('active');
        clearInterval(pInt); pRun=false; pStart.textContent='Старт';
        pMode=b.dataset.m; pTotal=parseInt(b.dataset.t)*60; pT=pTotal;
        pLabel.textContent = pMode==='work'?'Фокус':pMode==='short'?'Короткий перерыв':'Длинный перерыв';
        updPomo();
    });
});
if('Notification' in window) Notification.requestPermission();
updPomo();

// --- 2048 ---
let b2048=[], s2048=0;
const elB = document.getElementById('g2048Board');
const elS = document.getElementById('g2048Score');
const elO = document.getElementById('g2048Over');
const elOT = document.getElementById('g2048OverText');

function init2048(){
    b2048=Array(4).fill(null).map(()=>Array(4).fill(0)); s2048=0; elS.textContent='0'; elO.classList.remove('show');
    add2048(); add2048(); draw2048();
}
function add2048(){
    const e=[];
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(b2048[r][c]===0)e.push([r,c]);
    if(!e.length)return false;
    const [r,c]=e[Math.floor(Math.random()*e.length)];
    b2048[r][c]=Math.random()<0.9?2:4; return true;
}
function draw2048(){
    elB.innerHTML=''; elB.appendChild(elO);
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
        const d=document.createElement('div'); d.className='g2048-cell';
        if(b2048[r][c]){ d.textContent=b2048[r][c]; d.dataset.v=b2048[r][c]; }
        elB.appendChild(d);
    }
}
function slide2048(row){
    let f=row.filter(x=>x!==0);
    for(let i=0;i<f.length-1;i++)if(f[i]===f[i+1]){f[i]*=2;s2048+=f[i];f[i+1]=0;}
    f=f.filter(x=>x!==0); while(f.length<4)f.push(0); return f;
}
function move2048(dir){
    let moved=false; const prev=b2048.map(r=>[...r]);
    if(dir==='left'){ for(let r=0;r<4;r++) b2048[r]=slide2048(b2048[r]); }
    else if(dir==='right'){ for(let r=0;r<4;r++) b2048[r]=slide2048(b2048[r].reverse()).reverse(); }
    else if(dir==='up'){ for(let c=0;c<4;c++){ let col=[b2048[0][c],b2048[1][c],b2048[2][c],b2048[3][c]]; col=slide2048(col); for(let r=0;r<4;r++)b2048[r][c]=col[r]; } }
    else if(dir==='down'){ for(let c=0;c<4;c++){ let col=[b2048[0][c],b2048[1][c],b2048[2][c],b2048[3][c]]; col=slide2048(col.reverse()).reverse(); for(let r=0;r<4;r++)b2048[r][c]=col[r]; } }
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(b2048[r][c]!==prev[r][c])moved=true;
    if(moved){ add2048(); elS.textContent=s2048; draw2048(); if(isOver2048()){ elOT.textContent='Игра окончена! Счёт: '+s2048; elO.classList.add('show'); } if(hasWon2048()){ elOT.textContent='🎉 Победа! 2048!'; elO.classList.add('show'); } }
}
function isOver2048(){ for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(b2048[r][c]===0)return false; for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(c<3&&b2048[r][c]===b2048[r][c+1])return false;if(r<3&&b2048[r][c]===b2048[r+1][c])return false;} return true; }
function hasWon2048(){ for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(b2048[r][c]===2048)return true; return false; }

// Единое управление: свайп пальцем на смартфоне и перетаскивание мышью на ПК.
let sx=0,sy=0, activePointer=null;
elB.addEventListener('pointerdown', e => {
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    sx=e.clientX; sy=e.clientY; activePointer=e.pointerId;
    elB.setPointerCapture(e.pointerId);
});
elB.addEventListener('pointerup', e => {
    if (e.pointerId !== activePointer) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    const ax=Math.abs(dx), ay=Math.abs(dy); if(Math.max(ax,ay)<30){ activePointer=null; return; }
    if(ax>ay) move2048(dx>0?'right':'left'); else move2048(dy>0?'down':'up');
    activePointer=null;
});
elB.addEventListener('pointercancel', () => { activePointer=null; });
// Keyboard
document.addEventListener('keydown',e=>{
    if(!document.getElementById('g2048').classList.contains('active'))return;
    switch(e.key){ case'ArrowUp':e.preventDefault();move2048('up');break; case'ArrowDown':e.preventDefault();move2048('down');break; case'ArrowLeft':e.preventDefault();move2048('left');break; case'ArrowRight':e.preventDefault();move2048('right');break; }
});
init2048();
</script>
